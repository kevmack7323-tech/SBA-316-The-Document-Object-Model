<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="portal.js" defer></script>
</head>
<body>

    <div class="container" id="pContainer" style="border: 2px solid black;">
        <div class="portal-container" id="zContainer" style="border: 1px solid white;">
            <h2>Enter Portal Here</h2>
            <form>
                <div class="form-group">
                    <label for="username">Current Galaxy Name</label><br>
                    <input type="text" id="username" name="username" minlength="10" required />
                </div>
                <div class="form-group">
                    <label for="password">Galaxy Code</label><br>
                    <input type="password" id="password" name="password" minlength="10" required />
                </div>
                <br>
                <button type="submit" id="submit">Enter Portal</button>
            </form>
            <a id="Forgot" href="Forgot-Galaxy-Code">Forgot Galaxy Code</a>
        </div>
    </div>

</body>
</html>
